[package]
name = "lumid"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lumi-proto.workspace = true
thiserror.workspace = true
lumi-index.workspace = true
# D1: `worker_threads` pasa de fijo a `num_cpus::get()` -- el atributo
# `#[tokio::main(worker_threads = ...)]` solo acepta un literal, así que ese
# cambio también obliga a construir el runtime a mano en `main()` en vez de
# la macro.
num_cpus = "1"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum = { version = "0.7", features = ["multipart"] }
# D4: "tls-rustls" activa `rustls/aws-lc-rs` explícitamente en el propio
# `Cargo.toml` de axum-server -- "tls-rustls-no-provider" trae exactamente lo
# mismo (rustls, rustls-pemfile, tokio-rustls, rustls-pki-types) sin forzar
# ningún proveedor criptográfico, dejando que sea `ring` (el único que este
# daemon instala de verdad, ver `main.rs`) quien gane.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
sha2.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "gzip", "stream"] }
# D4: sin `default-features`, `rustls` activa el proveedor `aws-lc-rs` ->
# `aws-lc-sys` (compilado con cmake+cc desde su build.rs, ~48 MB de
# artefactos) aunque `main.rs` instale explícitamente
# `rustls::crypto::ring::default_provider()` -- todo ese código se compilaba,
# se enlazaba y no se ejecutaba nunca. `ring` es el proveedor que este daemon
# usa de verdad.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# D15: "compression-gzip" activa `CompressionLayer` -- estaba declarada sin
# usar. Solo gzip (ponytail): universal en cualquier cliente HTTP, sin sumar
# las dependencias de brotli/zstd que este daemon no necesita para JSON.
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
nvml-wrapper = "0.10"
sysinfo = "0.32"
tokio-stream = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bs58 = "0.5"
rand.workspace = true
async-stream = "0.3"
base64.workspace = true
zip.workspace = true
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
rustls-pemfile = "2"
rustls-pki-types = "1"
bytes = "1"
console-subscriber = { version = "0.4", optional = true }
# Motor de plantillas para el informe forense en LaTeX -- sintaxis Jinja2,
# nada de `tera`/`handlebars` estaba ya en el workspace.
tera = "2.3.0"

[features]
# Aparte por defecto: exige compilar con `--cfg tokio_unstable` (API de
# instrumentación de tareas de tokio, todavia no estable) y abre un puerto
# gRPC nuevo — nada de esto pinta en un build de produccion normal.
console = ["dep:console-subscriber", "tokio/tracing"]

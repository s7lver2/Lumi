[workspace]
resolver = "2"
members = ["crates/lumi-proto", "crates/lumi-index", "crates/lumid", "crates/lumi-cli", "crates/lumi-installer"]
# ponytail: client/src-tauri e indexer/src-tauri son proyectos Cargo aparte
# (los gestiona `tauri`, no este workspace); sin excluirlos, cargo los reclama
# igual por estar bajo este árbol de directorios.
exclude = ["client/src-tauri", "indexer/src-tauri", "installer/src-tauri"]

[workspace.package]
version = "2.0.15"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
lumi-proto = { path = "crates/lumi-proto" }
lumi-index = { path = "crates/lumi-index" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
bs58 = "0.5"
rand = "0.8"
argon2 = "0.5"
chacha20poly1305 = "0.10"
tokio = { version = "1", features = ["full"] }
log = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

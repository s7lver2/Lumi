[workspace]

# ponytail: sin esto, cifrar un trozo de ~1,8 GB con AES-GCM en modo `dev`
# tarda minutos en vez de segundos -- es lo que se veía como "colgado" tras
# terminar de empaquetar. El código propio de la app se queda sin optimizar
# (compila igual de rápido en cada cambio); solo las dependencias —criptografía,
# zip, reqwest— se compilan con optimización real.
[profile.dev.package."*"]
opt-level = 2

[package]
name = "indexer-app"
version = "2.0.12"
description = "Lumi Indexer"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.77.2"

[lib]
name = "indexer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
tokio = { version = "1", features = ["full"] }
lumi-index = { path = "../../crates/lumi-index" }
lumi-proto = { path = "../../crates/lumi-proto" }
lumi-installer = { path = "../../crates/lumi-installer" }
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.5"
sha2 = "0.10"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
async-trait = "0.1"
urlencoding = "2"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
bip39 = { version = "2", features = ["spanish"] }
base64 = "0.22"

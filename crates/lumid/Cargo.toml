[package]
name = "lumid"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lumi-proto.workspace = true
thiserror.workspace = true
lumi-index.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum = { version = "0.7", features = ["multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
sha2.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "gzip", "stream"] }
rustls = "0.23"
tower-http = { version = "0.6", features = ["cors"] }
rusqlite = { version = "0.32", features = ["bundled"] }
nvml-wrapper = "0.10"
sysinfo = "0.32"
tokio-stream = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bs58 = "0.5"
rand.workspace = true
async-stream = "0.3"
base64.workspace = true
zip.workspace = true
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
rustls-pemfile = "2"
rustls-pki-types = "1"
bytes = "1"
console-subscriber = { version = "0.4", optional = true }

[features]
# Aparte por defecto: exige compilar con `--cfg tokio_unstable` (API de
# instrumentación de tareas de tokio, todavia no estable) y abre un puerto
# gRPC nuevo — nada de esto pinta en un build de produccion normal.
console = ["dep:console-subscriber", "tokio/tracing"]
